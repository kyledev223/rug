# Vercel Hobby crons run at most once a day. This workflow triggers the
# watchlist alert sweep every 30 minutes for free. Set two repository secrets:
#   APP_URL      e.g. https://your-app.vercel.app
#   CRON_SECRET  same value as the CRON_SECRET env var on Vercel
name: alerts-sweep

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger alert sweep
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET not configured; skipping."
            exit 0
          fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/alerts"
